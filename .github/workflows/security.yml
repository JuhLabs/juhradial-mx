# JuhRadial MX Security Scan
#
# OSV-Scanner checks every lockfile (daemon/, crates/mx-keypad/,
# docs/requirements.txt) against the OSV database: the same scanner and data
# behind OpenSSF Scorecard's Vulnerabilities check, so an advisory fails here
# before Scorecard reports it. daemon/osv-scanner.toml lists the accepted
# informational advisories, each with a reason and an expiry date.
name: Security Scan

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  schedule:
    - cron: '0 6 * * 1'  # Weekly on Monday
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Pushes, the weekly run and manual runs: every open advisory, uploaded to
  # code scanning; the run fails while one is open.
  scan:
    name: OSV-Scanner
    if: github.event_name != 'pull_request'
    permissions:
      actions: read
      contents: read
      security-events: write
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable.yml@b1d267aea5211fa648d9d442fa64b90dbdcbdd36 # v2.7.0
    with:
      scan-args: |-
        --recursive
        ./

  # Pull requests: fails only on advisories the pull request brings in.
  scan-pr:
    name: OSV-Scanner (pull request)
    if: github.event_name == 'pull_request'
    permissions:
      actions: read
      contents: read
      security-events: write
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable-pr.yml@b1d267aea5211fa648d9d442fa64b90dbdcbdd36 # v2.7.0
    with:
      scan-args: |-
        --recursive
        ./
