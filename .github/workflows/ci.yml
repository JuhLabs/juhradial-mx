# JuhRadial MX CI Pipeline
name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  nix:
    name: Nix package and module
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Nix
        uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1

      - name: Build package
        run: nix build --print-build-logs

      - name: Check flake and NixOS module
        run: nix flake check --print-build-logs

  build:
    name: Build & Test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libdbus-1-dev \
            pkg-config \
            libudev-dev \
            libhidapi-dev \
            libhidapi-hidraw0

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: daemon -> target

      - name: Build Rust daemon
        working-directory: daemon
        run: cargo build --release

      - name: Run Rust tests
        working-directory: daemon
        run: cargo test --verbose

      - name: Test MX Keypad protocol
        run: cargo test --locked --manifest-path crates/mx-keypad/Cargo.toml

      - name: Validate structure
        run: |
          echo "Validating project structure..."
          test -f daemon/src/main.rs
          test -f overlay/juhradial-overlay.py
          test -f overlay/settings_dashboard.py
          echo "✓ Structure valid"

  python-tests:
    name: Python tests
    runs-on: ubuntu-latest
    # The whole suite runs where the settings app has every Qt feature it
    # draws with (Qt 6.9 or newer, all QML modules in one package). The
    # "Settings on ..." job below runs the same QML on Qt 6.4 and on
    # Debian's one-package-per-module layout.
    container: fedora:44
    timeout-minutes: 15

    steps:
      - name: Install Python, Qt and GTK test dependencies
        run: |
          dnf -y install \
            git \
            python3-pytest \
            python3-pyqt6 \
            python3-gobject \
            python3-cairo \
            gtk4 \
            libadwaita \
            python3-pillow \
            python3-numpy \
            python3-cryptography \
            python3-requests \
            python3-zeroconf \
            qt6-qtdeclarative \
            qt6-qtsvg \
            mesa-libEGL \
            mesa-libGL \
            libxkbcommon \
            dejavu-sans-fonts

      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Qt 6.9+ with QtQml is present
        run: |
          python3 - <<'PY'
          from PyQt6 import QtCore, QtQml, QtSvg
          assert QtCore.QT_VERSION >= 0x060900, QtCore.QT_VERSION_STR
          print("Qt", QtCore.QT_VERSION_STR, "PyQt", QtCore.PYQT_VERSION_STR)
          PY

      # The container runs as root; the installer test refuses root (as the
      # installer itself does), so the suite runs as an ordinary user.
      - name: Run Python tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          useradd -m ci
          chown -R ci .
          runuser -u ci -- env QT_QPA_PLATFORM=offscreen python3 -m pytest -q -rs tests/

      # The QML modules must have run, not skipped: a skip here means the
      # settings app's QML was never compiled by this job.
      - name: QML tests ran (no skips)
        run: |
          runuser -u ci -- env QT_QPA_PLATFORM=offscreen python3 -m pytest -q -rs tests/test_settings_qt_smoke.py tests/test_qml_slot_arguments.py | tee qml-tests.log
          if grep -q "SKIP" qml-tests.log; then
            echo "QML tests were skipped" >&2
            exit 1
          fi

  # The settings app where issues #168 and #172 came from: Debian-family
  # systems, which package every QML module on its own, on the oldest Qt the
  # app runs on (6.4: Ubuntu 24.04, Linux Mint 22) and on a current one. The
  # packages are the installer's own lists, so a module the QML imports and
  # the installer forgets fails here and not on somebody's desktop.
  settings-debian:
    name: Settings on ${{ matrix.image }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        image: ["ubuntu:24.04", "debian:testing"]
    container: ${{ matrix.image }}
    timeout-minutes: 15
    env:
      DEBIAN_FRONTEND: noninteractive

    steps:
      - name: Install git, Python and PyQt6
        run: |
          apt-get update
          apt-get install -y git python3 python3-pytest python3-pyqt6 python3-pyqt6.qtsvg fonts-dejavu-core

      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install the QML packages the installer installs
        shell: bash
        run: |
          set -euo pipefail
          eval "$(sed -n '/^DEBIAN_QML_PKGS="/,/^DEBIAN_QML_OPTIONAL_PKGS=/p' install.sh)"
          apt-get install -y $DEBIAN_QML_PKGS
          for pkg in $DEBIAN_QML_OPTIONAL_PKGS; do
            if apt-cache show "$pkg" > /dev/null 2>&1; then
              apt-get install -y "$pkg"
            fi
          done

      # "missing" is a part this Qt has and no installed package provides:
      # the installer's lists are short again.
      - name: Nothing this Qt offers is left uninstalled
        shell: bash
        run: |
          set -euo pipefail
          python3 settings-qt/bridge/compat.py | tee compat.log
          if grep -q "missing" compat.log; then
            echo "the installer's package lists leave a QML module out" >&2
            exit 1
          fi

      - name: Every Settings page loads, and the settings tests pass
        shell: bash
        run: |
          set -euo pipefail
          useradd -m ci
          chown -R ci .
          runuser -u ci -- env QT_QPA_PLATFORM=offscreen python3 settings-qt/tools/qml_check.py
          runuser -u ci -- env QT_QPA_PLATFORM=offscreen python3 -m pytest -q -rs \
            tests/test_qt_compat.py tests/test_qml_packages.py tests/test_page_error.py \
            tests/test_settings_qt_smoke.py tests/test_qml_slot_arguments.py tests/test_qml_i18n.py | tee qml-tests.log
          if grep -q "SKIP" qml-tests.log; then
            echo "QML tests were skipped" >&2
            exit 1
          fi
