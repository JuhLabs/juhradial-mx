# JuhRadial MX CI Pipeline
name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  nix:
    name: Nix package and module
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Nix
        uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1

      - name: Build package
        run: nix build --print-build-logs

      - name: Check flake and NixOS module
        run: nix flake check --print-build-logs

  build:
    name: Build & Test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libdbus-1-dev \
            pkg-config \
            libudev-dev \
            libhidapi-dev \
            libhidapi-hidraw0

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: daemon -> target

      - name: Build Rust daemon
        working-directory: daemon
        run: cargo build --release

      - name: Run Rust tests
        working-directory: daemon
        run: cargo test --verbose

      - name: Test MX Keypad protocol
        run: cargo test --locked --manifest-path crates/mx-keypad/Cargo.toml

      - name: Validate structure
        run: |
          echo "Validating project structure..."
          test -f daemon/src/main.rs
          test -f overlay/juhradial-overlay.py
          test -f overlay/settings_dashboard.py
          echo "✓ Structure valid"

  python-tests:
    name: Python tests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install system Python dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            python3-pytest \
            python3-pip \
            python3-gi \
            python3-gi-cairo \
            gir1.2-gtk-4.0 \
            gir1.2-adw-1 \
            python3-pil \
            python3-numpy \
            libegl1 \
            libgl1 \
            libxkbcommon0

      # The settings app needs Qt 6.9 or newer with QtQml (juhradial-settings
      # falls back to GTK below that). Ubuntu's python3-pyqt6 is Qt 6.4 and
      # ships QtQml separately, so the QML tests would skip themselves: take
      # the PyPI wheel, which bundles a current Qt, and refuse anything older.
      - name: Install PyQt6 with QtQml (Qt 6.9+)
        run: |
          python3 -m pip install --break-system-packages "PyQt6>=6.9"
          python3 - <<'PY'
          from PyQt6 import QtCore, QtQml, QtSvg
          assert QtCore.QT_VERSION >= 0x060900, QtCore.QT_VERSION_STR
          print("Qt", QtCore.QT_VERSION_STR, "PyQt", QtCore.PYQT_VERSION_STR)
          PY

      - name: Run Python tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: python3 -m pytest -q tests/

      # The QML modules must have run, not skipped: a skip here means the
      # settings app's QML was never compiled by this job.
      - name: QML tests ran (no skips)
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          python3 -m pytest -q -rs tests/test_settings_qt_smoke.py tests/test_qml_slot_arguments.py | tee qml-tests.log
          if grep -q "SKIP" qml-tests.log; then
            echo "QML tests were skipped" >&2
            exit 1
          fi
