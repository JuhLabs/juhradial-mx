version: 2
updates:
  # Rust daemon dependencies
  - package-ecosystem: cargo
    directory: /daemon
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: "deps"
    labels:
      - dependencies
      - rust
    groups:
      # Patch releases share one pull request a week. Minor and major
      # versions (a minor version can break a 0.x crate) keep one each.
      cargo-patch:
        update-types:
          - patch

  # GitHub Actions workflow versions
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: "ci"
    labels:
      - dependencies
      - github-actions
    groups:
      # init, autobuild, analyze and upload-sarif are one release: a pull
      # request per step leaves them on different versions when only some
      # are merged, and the analysis then fails.
      codeql-action:
        patterns:
          - "github/codeql-action*"
      # Every other action's minor and patch releases in one pull request; a
      # major version keeps its own. A dependency joins the first group it
      # matches, so CodeQL stays in the group above.
      actions-minor-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
