version: 2
updates:
  # Rust daemon dependencies
  - package-ecosystem: cargo
    directory: /daemon
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: "deps"
    labels:
      - dependencies
      - rust

  # GitHub Actions workflow versions
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: "ci"
    labels:
      - dependencies
      - github-actions
    groups:
      # init, autobuild, analyze and upload-sarif are one release: a pull
      # request per step leaves them on different versions when only some
      # are merged, and the analysis then fails.
      codeql-action:
        patterns:
          - "github/codeql-action*"
