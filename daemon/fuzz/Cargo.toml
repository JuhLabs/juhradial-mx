[package]
name = "juhradiald-fuzz"
version = "0.0.0"
edition = "2021"
publish = false
license = "GPL-3.0"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
juhradiald = { path = ".." }
mx-keypad = { path = "../../crates/mx-keypad" }
serde_json = "1"
tempfile = "3"
zip = { version = "8", default-features = false, features = ["deflate-flate2-zlib-rs"] }

# Its own workspace: built only by `cargo fuzz`, with a nightly toolchain.
[workspace]

[[bin]]
name = "hidpp_reports"
path = "fuzz_targets/hidpp_reports.rs"
test = false
doc = false
bench = false

[[bin]]
name = "keypad_reports"
path = "fuzz_targets/keypad_reports.rs"
test = false
doc = false
bench = false

[[bin]]
name = "config_json"
path = "fuzz_targets/config_json.rs"
test = false
doc = false
bench = false

[[bin]]
name = "backup_import"
path = "fuzz_targets/backup_import.rs"
test = false
doc = false
bench = false
